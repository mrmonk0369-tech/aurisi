name: Sync AURISI (verify v60.76)
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v60.76 (premium clean settings + direct 2-theme switch)
        run: |
          set -e
          test "$(wc -c < AURISI.html)" -eq 1778042
          grep -q 'APP_VERSION="60.76"' AURISI.html
          grep -q 'PROFESSOR STANDARD' AURISI.html
          grep -q 'aurisiThemeToggle' AURISI.html
          grep -q 'Danger zone' AURISI.html
          echo "v60.76 verified"
