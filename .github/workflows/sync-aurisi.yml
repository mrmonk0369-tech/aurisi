name: Build AURISI v60.24
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          test -f AURISI.html
          if grep -q 'APP_VERSION="60.24"' AURISI.html; then echo "already v60.24 - nothing to do"; exit 0; fi
          test "$(wc -c < AURISI.html)" -eq 1855834
          python3 .github/scripts/build_v6024.py AURISI.html AURISI_new.html
          test "$(wc -c < AURISI_new.html)" -eq 1855929
          grep -q '<h2>Aurisi</h2>' AURISI_new.html
          grep -q 'OPENING GREETING' AURISI_new.html
          ! grep -q 'class="vandana"' AURISI_new.html
          mv AURISI_new.html AURISI.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AURISI.html
          git commit -m "chore: build AURISI v60.24 (Aurisi word + Jai Shree Ram greeting)" || echo "no changes"
          git push
