name: Sync AURISI (verify v60.78)
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v60.78 (on-demand single model download + quality labels)
        run: |
          set -e
          test "$(wc -c < AURISI.html)" -eq 1781260
          grep -q 'APP_VERSION="60.78"' AURISI.html
          grep -q 'PROFESSOR STANDARD' AURISI.html
          grep -q 'strongest small model' AURISI.html
          grep -q 'aurisiThemeToggle' AURISI.html
          echo "v60.78 verified"
