name: Build AURISI v58.3
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          test -f AURISI.html
          if grep -q 'APP_VERSION="58.3"' AURISI.html; then echo "already v58.3 - nothing to do"; exit 0; fi
          test "$(wc -c < AURISI.html)" -eq 1156157
          python3 .github/scripts/build_v583.py AURISI.html AURISI_new.html
          test "$(wc -c < AURISI_new.html)" -eq 1159445
          mv AURISI_new.html AURISI.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AURISI.html
          git commit -m "chore: build AURISI v58.3 (Spaced Repetition hub)" || echo "no changes"
          git push
