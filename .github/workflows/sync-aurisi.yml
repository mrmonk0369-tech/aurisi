name: Sync AURISI (verify v60.71)
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v60.71 (chat-first + saved chats + Settings visible)
        run: |
          set -e
          test "$(wc -c < AURISI.html)" -eq 1755688
          grep -q 'APP_VERSION="60.71"' AURISI.html
          grep -q 'PROFESSOR STANDARD' AURISI.html
          for s in SEALED sealed-hide seal-target aurisiApplySeal; do
            if grep -q "$s" AURISI.html; then echo "REMNANT: $s"; exit 1; fi
          done
          echo "v60.71 verified: chat-first, seal removed, professor present"
