name: Build AURISI v60.46 + Institute Portal v2 + HQ
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          test -f AURISI.html
          if ! grep -q 'APP_VERSION="60.46"' AURISI.html; then
            test "$(wc -c < AURISI.html)" -eq 1947341
            python3 .github/scripts/build_v6046.py AURISI.html AURISI_new.html
            test "$(wc -c < AURISI_new.html)" -eq 1890536
            grep -q 'openInstCourses' AURISI_new.html
            grep -q 'Aurisi Script' AURISI_new.html && exit 1 || true
            mv AURISI_new.html AURISI.html
          fi
          python3 .github/scripts/build_institute_v2.py institute_new.html
          test "$(wc -c < institute_new.html)" -eq 19629
          grep -q 'Aurisi platform fee' institute_new.html
          mv institute_new.html institute.html
          python3 .github/scripts/build_hq.py admin_new.html
          test "$(wc -c < admin_new.html)" -eq 22111
          grep -q 'AURISI HQ' admin_new.html
          mv admin_new.html admin.html
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add AURISI.html institute.html admin.html
            git commit -m "chore: build v60.46 + institute v2 + HQ"
            git push
          fi
