name: Build AURISI v58
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          test -f AURISI.html
          test "$(wc -c < AURISI.html)" -eq 1093584
          python3 .github/scripts/build_v58.py AURISI.html AURISI_new.html
          test "$(wc -c < AURISI_new.html)" -eq 1100066
          mv AURISI_new.html AURISI.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AURISI.html
          git commit -m "chore: build AURISI v58.0 (Fix & Flow)" || echo "no changes"
          git push
