name: Sync AURISI (verify v60.79)
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v60.79 (install fix)
        run: |
          set -e
          test "$(wc -c < AURISI.html)" -eq 1781675
          grep -q 'APP_VERSION="60.79"' AURISI.html
          grep -q 'Add to Home screen' AURISI.html
          grep -q 'rel="manifest"' index.html
          grep -q 'serviceWorker' index.html
          echo "v60.79 verified: install row + PWA landing page"
