name: Sync AURISI (verify v60.83)
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v60.83
        run: |
          set -e
          test "$(wc -c < AURISI.html)" -eq 1782567
          grep -q 'APP_VERSION="60.83"' AURISI.html
          grep -q '.prof-screen.started .prof-side{display:none!important}' AURISI.html
          grep -q 'profToggleSide' AURISI.html
          grep -q 'PROFESSOR STANDARD' AURISI.html
          echo "v60.83 verified: full-screen language professor"
