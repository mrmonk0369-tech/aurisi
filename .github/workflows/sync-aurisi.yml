name: Build AURISI v60.55 + Institute Portal v2 + HQ v2
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          test -f AURISI.html
          if ! grep -q 'APP_VERSION="60.55"' AURISI.html; then
            test "$(wc -c < AURISI.html)" -eq 1946390
            python3 .github/scripts/build_v6055.py AURISI.html AURISI_new.html
            test "$(wc -c < AURISI_new.html)" -eq 1945893
            grep -q 'IMMERSION RULE' AURISI_new.html
            grep -q 'NEVER write a single Hindi word' AURISI_new.html
            grep -q 'never Hindi' AURISI_new.html
            grep -q 'llHub' AURISI_new.html
            grep -q 'llPronCheck' AURISI_new.html
            mv AURISI_new.html AURISI.html
          fi
          python3 .github/scripts/build_institute_v2.py institute_new.html
          test "$(wc -c < institute_new.html)" -eq 19629
          grep -q 'Aurisi platform fee' institute_new.html
          mv institute_new.html institute.html
          python3 .github/scripts/build_hq.py admin_new.html
          test "$(wc -c < admin_new.html)" -eq 22598
          grep -q 'AURISI HQ' admin_new.html
          grep -q 'ghTok' admin_new.html
          mv admin_new.html admin.html
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add AURISI.html institute.html admin.html
            git commit -m "chore: build v60.55 + institute v2 + HQ v2"
            git push
          fi
