name: Sync AURISI (verify v60.72)
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v60.72 (Language Professor EN+ES, API voice + mic)
        run: |
          set -e
          test "$(wc -c < AURISI.html)" -eq 1783632
          grep -q 'APP_VERSION="60.72"' AURISI.html
          grep -q 'PROFESSOR STANDARD' AURISI.html
          grep -q 'profScreen' AURISI.html
          grep -q 'AURALIS_EN_ES' AURISI.html
          grep -q 'SpeechRecognition' AURISI.html
          echo "v60.72 verified: Language Professor present, professor standard intact"
