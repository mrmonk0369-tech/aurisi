name: Build AURISI v60.21
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          test -f AURISI.html
          if grep -q 'APP_VERSION="60.21"' AURISI.html; then echo "already v60.21 - nothing to do"; exit 0; fi
          test "$(wc -c < AURISI.html)" -eq 1854677
          python3 .github/scripts/build_v6021.py AURISI.html AURISI_new.html
          test "$(wc -c < AURISI_new.html)" -eq 1855059
          grep -q 'text-fill-color:transparent' AURISI_new.html
          grep -q 'data-i18n="welcomeSub"' AURISI_new.html
          ! grep -q '.welcome,.lock-pdf' AURISI_new.html
          mv AURISI_new.html AURISI.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AURISI.html
          git commit -m "chore: build AURISI v60.21 (Gemini Welcome)" || echo "no changes"
          git push
