name: Build AURISI v60.64 + Institute Portal v2 + HQ v3
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          test -f AURISI.html
          if ! grep -q 'APP_VERSION="60.64"' AURISI.html; then
            test "$(wc -c < AURISI.html)" -eq 1904318
            python3 .github/scripts/build_v6064.py AURISI.html AURISI_new.html
            test "$(wc -c < AURISI_new.html)" -eq 1774257
            grep -q 'APP_VERSION="60.64"' AURISI_new.html
            if grep -q '"cat": "korean"' AURISI_new.html; then echo 'korean pack still present'; exit 1; fi
            if grep -q 'id:"spanish"' AURISI_new.html; then echo 'spanish collection still present'; exit 1; fi
            if grep -q 'Learn a language' AURISI_new.html; then echo 'language pill still present'; exit 1; fi
            grep -q 'id:"neet"' AURISI_new.html
            mv AURISI_new.html AURISI.html
          fi
          python3 .github/scripts/build_institute_v2.py institute_new.html
          test "$(wc -c < institute_new.html)" -eq 19629
          grep -q 'Aurisi platform fee' institute_new.html
          mv institute_new.html institute.html
          python3 .github/scripts/build_hq.py admin_new.html
          test "$(wc -c < admin_new.html)" -eq 25694
          grep -q 'AURISI HQ' admin_new.html
          mv admin_new.html admin.html
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add AURISI.html institute.html admin.html
            git commit -m "chore: build v60.64 (language content removed from library) + institute v2 + HQ v3"
            git push
          fi
