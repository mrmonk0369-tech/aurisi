name: Build AURISI v60.41
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          test -f AURISI.html
          if grep -q 'APP_VERSION="60.41"' AURISI.html; then echo "already v60.41 - nothing to do"; exit 0; fi
          test "$(wc -c < AURISI.html)" -eq 1874490
          python3 .github/scripts/build_v6041.py AURISI.html AURISI_new.html
          test "$(wc -c < AURISI_new.html)" -eq 1878484
          grep -q 'function langAddWord(' AURISI_new.html
          grep -q 'DAILY DOSE: in every session teach 5 new useful everyday words' AURISI_new.html
          grep -q 'function langRules(){' AURISI_new.html
          grep -c 'function langRules(){' AURISI_new.html | grep -q '^1$'
          mv AURISI_new.html AURISI.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AURISI.html
          git commit -m "chore: build AURISI v60.41 (Language Hub Pro)" || echo "no changes"
          git push
