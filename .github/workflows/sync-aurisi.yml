name: Sync AURISI (verify v60.81)
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v60.81
        run: |
          set -e
          test "$(wc -c < AURISI.html)" -eq 1782410
          grep -q 'APP_VERSION="60.81"' AURISI.html
          grep -q 'PROFESSOR STANDARD' AURISI.html
          grep -q 'Learn American English' AURISI.html
          grep -q 'openProfessor' AURISI.html
          echo "v60.81 verified: American English teacher ready"
