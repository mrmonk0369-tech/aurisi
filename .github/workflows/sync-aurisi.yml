name: Sync AURISI (verify v60.74)
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v60.74 (clean settings + native-speaker professor)
        run: |
          set -e
          test "$(wc -c < AURISI.html)" -eq 1781817
          grep -q 'APP_VERSION="60.74"' AURISI.html
          grep -q 'PROFESSOR STANDARD' AURISI.html
          grep -q 'profNative' AURISI.html
          grep -q 'profScreen' AURISI.html
          if grep -q 'WHO USES AURISI' AURISI.html; then echo 'role picker left'; exit 1; fi
          echo "v60.74 verified: settings cleaned, native-speaker professor present"
