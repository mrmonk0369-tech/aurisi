name: Sync AURISI (verify v60.73)
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v60.73 (chat-only; features moved to backend)
        run: |
          set -e
          test "$(wc -c < AURISI.html)" -eq 1783932
          grep -q 'APP_VERSION="60.73"' AURISI.html
          grep -q 'PROFESSOR STANDARD' AURISI.html
          grep -q '#drawer,#drawerBack{display:none!important}' AURISI.html
          grep -q 'aria-label="Chats"' AURISI.html
          echo "v60.73 verified: chat-only UI, drawer hidden, features in backend"
