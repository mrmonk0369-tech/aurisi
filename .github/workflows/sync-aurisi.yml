name: Sync AURISI (verify v60.80)
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v60.80
        run: |
          set -e
          test "$(wc -c < AURISI.html)" -eq 1781356
          grep -q 'APP_VERSION="60.80"' AURISI.html
          if grep -q 'Install the app' AURISI.html; then echo 'install row left'; exit 1; fi
          grep -q 'rel="manifest"' AURISI.html
          echo "v60.80 verified: install row removed; PWA still intact"
