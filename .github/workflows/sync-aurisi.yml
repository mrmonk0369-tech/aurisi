name: Sync AURISI (verify v60.77)
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v60.77 (single clean settings panel)
        run: |
          set -e
          test "$(wc -c < AURISI.html)" -eq 1778640
          grep -q 'APP_VERSION="60.77"' AURISI.html
          grep -q 'PROFESSOR STANDARD' AURISI.html
          grep -q 'aurisiThemeToggle' AURISI.html
          echo "v60.77 verified"
