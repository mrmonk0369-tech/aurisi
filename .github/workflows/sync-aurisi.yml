name: Build AURISI v60.66 + Institute Portal v2 + HQ v3
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          test -f AURISI.html
          if ! grep -q 'APP_VERSION="60.66"' AURISI.html; then
            test "$(wc -c < AURISI.html)" -eq 1776360
            python3 .github/scripts/build_v6066.py AURISI.html AURISI_new.html
            test "$(wc -c < AURISI_new.html)" -eq 1779806
            grep -q 'APP_VERSION="60.66"' AURISI_new.html
            grep -q 'AURISI_GPU_WGSL' AURISI_new.html
            grep -q 'aurisiGpuPlot' AURISI_new.html
            grep -q 'function drawGraph57(cv,expr,xmin,xmax){' AURISI_new.html
            mv AURISI_new.html AURISI.html
          fi
          python3 .github/scripts/build_institute_v2.py institute_new.html
          test "$(wc -c < institute_new.html)" -eq 19629
          mv institute_new.html institute.html
          python3 .github/scripts/build_hq.py admin_new.html
          test "$(wc -c < admin_new.html)" -eq 25694
          mv admin_new.html admin.html
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add AURISI.html institute.html admin.html
            git commit -m "chore: build v60.66 (WebGPU graph engine) + institute v2 + HQ v3"
            git push
          fi
