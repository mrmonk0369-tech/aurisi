name: Build AURISI v60.39
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          test -f AURISI.html
          if grep -q 'APP_VERSION="60.39"' AURISI.html; then echo "already v60.39 - nothing to do"; exit 0; fi
          test "$(wc -c < AURISI.html)" -eq 1869686
          python3 .github/scripts/build_v6039.py AURISI.html AURISI_new.html
          test "$(wc -c < AURISI_new.html)" -eq 1870070
          grep -q 'Never talk about who discovered or invented the concept' AURISI_new.html
          grep -q 'HIDE_SEND=true;try{quick("SCIENCE LAB ON.' AURISI_new.html
          grep -c 'function scienceLab(){' AURISI_new.html | grep -q '^1$'
          mv AURISI_new.html AURISI.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AURISI.html
          git commit -m "chore: build AURISI v60.39 (no biography + SVG fence fix + hidden activations)" || echo "no changes"
          git push
