name: Build AURISI v57
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          curl -fsSL -m 120 -o AURISI.html "https://github.com/mrmonk0369-tech/aurisi/releases/download/v56.0.0/AURISI.html"
          test "$(wc -c < AURISI.html)" -eq 1076828
          python3 .github/scripts/build_v57.py AURISI.html
          test "$(wc -c < AURISI.html)" -eq 1093584
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AURISI.html
          git commit -m "chore: build AURISI v57.0 (Power Features Drop)" || echo "no changes"
          git push
