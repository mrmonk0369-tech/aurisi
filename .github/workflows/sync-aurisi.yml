name: Build AURISI v59.0
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          test -f AURISI.html
          if grep -q 'APP_VERSION="59.0"' AURISI.html; then echo "already v59.0 - nothing to do"; exit 0; fi
          test "$(wc -c < AURISI.html)" -eq 1166669
          python3 .github/scripts/build_v590.py AURISI.html AURISI_new.html
          test "$(wc -c < AURISI_new.html)" -eq 1177328
          mv AURISI_new.html AURISI.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AURISI.html
          git commit -m "chore: build AURISI v59.0 (Institute Mode B2B)" || echo "no changes"
          git push
