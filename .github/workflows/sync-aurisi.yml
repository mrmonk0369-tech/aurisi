name: Sync AURISI (verify v60.69)
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify v60.69 (professor + surgery)
        run: |
          set -e
          test "$(wc -c < AURISI.html)" -eq 1746558
          grep -q 'APP_VERSION="60.69"' AURISI.html
          grep -q 'PROFESSOR STANDARD' AURISI.html
          for s in TALK_SCENARIOS SANS_ON makePodcast openVideoStudio dailyBrief lockerQuiz LOCKER_CTX openTalk renderSanskritChip; do
            if grep -q "$s" AURISI.html; then echo "REMNANT: $s"; exit 1; fi
          done
          echo "v60.69 verified: 1746558 bytes, professor standard present, 6 features removed"
